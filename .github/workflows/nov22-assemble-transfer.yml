name: Assemble verified Nov22 media on research feature branch
on:
  push:
    branches: [feat/nov22-nine-ticker-edition]
    paths: [.github/workflows/nov22-assemble-transfer.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'HumanLAIer/humanlaier-site-deploy' && github.ref == 'refs/heads/feat/nov22-nine-ticker-edition'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify the approved public media blobs
        run: |
          set -euo pipefail
          D=streaming-lab/nine-tickers-nov22
          test "$(find .nov22-transfer -type f | wc -l)" = 22
          for i in 1 2; do
            test "$(find .nov22-transfer -name "part-$i.*" | wc -l)" = 11
            cat .nov22-transfer/part-$i.* > "$D/part-$i.flac"
          done
          cd "$D"
          sha256sum -c <<'EOF'
          55dcb8c92c35cff9fd5665b32632455812e2c29b6866a7f0d57d00d54404017c  part-1.flac
          1b52e1e254d33488477f741a5811f026a57177b4063fcbd13849737eec424035  part-2.flac
          e3d8eda5eb16fb5c8089ddf5e7b17827f087b755053c7f75c08e753e7ae92cc6  part-3.flac
          8669a3403f609db40ee427842d4446852c292c0e21b7284850d43edcd8e486e6  comparison.json
          EOF
          echo "Media blob hashes: $(git hash-object part-1.flac) $(git hash-object part-2.flac)"
          test "$(git hash-object part-1.flac)" = 38f5c8dbbc46651ecfee43b6898f1f9ab99daf4a
          test "$(git hash-object part-2.flac)" = e50f2c5e154a8037dc5aae429e90f25efe4db2bc
          cd ../..
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg; fi
          node scripts/verify-nov22-nine.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .nov22-transfer
          git add streaming-lab/nine-tickers-nov22/part-1.flac streaming-lab/nine-tickers-nov22/part-2.flac
          git commit -m "Assemble exact verified lossless Nov22 audio and remove transport chunks"
          git push origin HEAD:refs/heads/feat/nov22-nine-ticker-edition
          echo "HL_ASSEMBLY_COMMIT $(git rev-parse HEAD)"
