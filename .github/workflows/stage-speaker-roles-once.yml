name: Stage verified Nov22 speaker demo evidence once
on:
  push:
    branches: [research/nov22-speaker-roles-demo]
    paths: [.github/workflows/stage-speaker-roles-once.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'numpy==1.26.4'
      - name: Transfer verified research archives
        env:
          DIAR_URL: "https://sdmntpreastus3.oaiusercontent.com/files/00000000-768c-8212-a63c-11b6b03344a7/raw?se=2026-11-24T21%3A49%3A48Z&sp=r&sv=2026-06-06&sr=b&scid=37c402f6-e89b-5729-ad00-92d5989060b8&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-24T12%3A51%3A30Z&ske=2026-11-25T12%3A51%3A30Z&sks=b&skv=2026-06-06&sig=jVovFoNGaXRHLXsz8HlTNJ0tjrpS0cTSd52C/aERdrE%3D"
          AUDIO_URL: "https://sdmntpreastus3.oaiusercontent.com/files/00000000-9edc-8212-bbd7-5a7318c6d6ac/raw?se=2026-11-24T21%3A49%3A48Z&sp=r&sv=2026-06-06&sr=b&scid=9d1a09c1-9101-5df6-aeb5-ab50b5c2335f&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-24T12%3A51%3A31Z&ske=2026-11-25T12%3A51%3A31Z&sks=b&skv=2026-06-06&sig=VXx3ZMD0P7wQ2wamldPlLqRMn1muKyM0aZc6dMLwzPA%3D"
          CONTEXT_URL: "https://sdmntpreastus3.oaiusercontent.com/files/00000000-d98c-8212-85b0-a72edc9c5ead/raw?se=2026-11-24T21%3A49%3A48Z&sp=r&sv=2026-06-06&sr=b&scid=227ad481-76a3-584f-85ce-2cc524424a8d&skoid=db055408-822b-485f-92f8-bfeb3ea92408&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-24T12%3A51%3A30Z&ske=2026-11-25T12%3A51%3A30Z&sks=b&skv=2026-06-06&sig=V%2Bs/CaQv6cHasN7/BP2O0KjPY2QLq8arQwVbUmn/JC0%3D"
        run: |
          set -euo pipefail
          echo "::add-mask::$DIAR_URL"
          echo "::add-mask::$AUDIO_URL"
          echo "::add-mask::$CONTEXT_URL"
          mkdir -p /tmp/hl-role
          curl -fsSL --max-time 90 "$DIAR_URL" -o /tmp/hl-role/diar.zip
          curl -fsSL --max-time 90 "$AUDIO_URL" -o /tmp/hl-role/audio.zip
          curl -fsSL --max-time 90 "$CONTEXT_URL" -o /tmp/hl-role/context.zip
          python scripts/stage-speaker-roles.py --diar /tmp/hl-role/diar.zip --audio /tmp/hl-role/audio.zip --context /tmp/hl-role/context.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streaming-lab/speaker-roles-nov22/role-data.json
          git rm .github/workflows/stage-speaker-roles-once.yml
          git commit -m "Stage verified speaker evidence and remove temporary transfer"
          git push origin HEAD:research/nov22-speaker-roles-demo
