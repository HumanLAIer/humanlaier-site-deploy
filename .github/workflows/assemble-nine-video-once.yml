name: Assemble one original 180s commercial source video for website
on:
  push:
    branches:
      - feature/broadcast-video-nine-lines-20261123
    paths:
      - 'streaming-demo/nine-tickers/.video-parts/**'
  pull_request:
    paths:
      - 'streaming-demo/nine-tickers/.video-parts/**'
      - '.github/workflows/assemble-nine-video-once.yml'
permissions:
  contents: write
concurrency:
  group: hl-one-time-original-nine-video-assembly
  cancel-in-progress: false
jobs:
  assemble-original:
    if: >-
      github.repository == 'HumanLAIer/humanlaier-site-deploy' &&
      (
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/feature/broadcast-video-nine-lines-20261123')
        ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.ref == 'feature/broadcast-video-nine-lines-20261123' &&
         github.event.pull_request.user.login == 'alex-hidden-laier')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/broadcast-video-nine-lines-20261123
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Byte-reassemble and ffprobe-verify source MP4 exactly
        run: python scripts/assemble-nine-ticker-video.py
      - name: Commit only verified MP4, remove all temporary binary segments
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r streaming-demo/nine-tickers/.video-parts
          git add streaming-demo/nine-tickers/commercial-180.mp4
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "feat: source-verified real 180s TikTok video with synchronized audio"
          git push origin HEAD:feature/broadcast-video-nine-lines-20261123
