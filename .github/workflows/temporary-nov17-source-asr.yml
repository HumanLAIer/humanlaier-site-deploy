name: One-shot original V4 video ASR candidate (never production)
on:
  pull_request:
    paths:
      - .github/workflows/temporary-nov17-source-asr.yml
      - scripts/oneoff_nov17_source_asr.py
permissions:
  contents: read
jobs:
  source-only-asr:
    if: github.repository == 'HumanLAIer/humanlaier-site-deploy' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded CPU source transcription
        run: python -m pip install --quiet --only-binary=:all: 'faster-whisper==1.2.1'
      - name: Transcribe only published 120s same-source MP4
        run: python scripts/oneoff_nov17_source_asr.py
      - name: Retain candidate source timestamps for independent review
        uses: actions/upload-artifact@v4
        with:
          name: nov17-same-source-asr-candidate
          path: nov17-participation-asr-candidate.json
          retention-days: 1
