name: Verify published Singlish ASR comparison
on:
  push:
    branches: [main]
    paths:
      - 'singlish-compare/**'
      - '.github/workflows/verify-singlish-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: node --check singlish-compare/app.js
      - name: Validate published source-derived data and accessible asset references
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const p = 'singlish-compare/';
          const data = JSON.parse(fs.readFileSync(p+'comparison.json','utf8'));
          assert.equal(data.schema,'hl-public-singlish-head-to-head-v1');
          assert.equal(data.status,'UNREVIEWED_MODEL_TRANSCRIPTS');
          assert.equal(data.sourceSession,'20261120T182048_569395Z_huatzaitcg');
          assert.equal(data.samplesAreContiguous,false);
          assert.equal(data.wordTimestampsVerified,false);
          assert.equal(data.humanGoldAvailable,false);
          assert.equal(data.durationSeconds,60);
          assert.equal(data.clips.length,4);
          assert.equal(data.waveform.length,120);
          const audio=fs.readFileSync(p+'comparison-audio.mp3');
          assert(audio.length > 100000 && audio.length < 1200000);
          assert.equal(audio.subarray(0,3).toString('ascii'),'ID3');
          for(let i=0;i<4;i++){
            const c=data.clips[i];
            assert.equal(c.id,'clip0'+i);
            assert.equal(c.index,i);
            assert.equal(c.timelineStart,i*15);
            assert.equal(c.timelineEnd,(i+1)*15);
            assert.equal(c.sourcePart,'part_000000.ts');
            assert.equal(typeof c.singlish,'string');
            assert.equal(typeof c.coats,'string');
            assert(Number.isFinite(c.sourcePartOffsetSeconds));
            if(i)assert(c.sourcePartOffsetSeconds>data.clips[i-1].sourcePartOffsetSeconds+15);
          }
          for(const k of ['singlish-small','coats-large-v2']){
            const m=data.modelMetrics[k];
            assert.equal(m.revision.length,40);
            assert(m.inferenceSeconds>0&&m.peakRssMib>0);
            assert.equal(m.wer,null);
          }
          const html=fs.readFileSync(p+'index.html','utf8');
          const script=fs.readFileSync(p+'app.js','utf8');
          assert(html.includes('id="sourceAudio"'));
          assert(html.includes('id="smallScroll"'));
          assert(html.includes('id="coatsScroll"'));
          assert(html.includes('app.js'));
          assert(html.includes('styles.css'));
          assert(script.includes('timeupdate'));
          assert(script.includes('followPane'));
          assert(script.includes('wordTimestampsVerified'));
          assert(fs.existsSync('streaming-demo/assets/human-laier-dark.svg'));
          console.log('Source fidelity, 4x15s bounds, two real transcript fields, audio, asset references and playback follow: PASS');
          JS
