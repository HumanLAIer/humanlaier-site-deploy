          echo "::add-mask::$URL"
          curl -fsSL --retry 2 --max-time 60 "$URL" -o /tmp/dsp-evidence/context-1.zip
          echo 'd5e59e5f8a92fa5893482c48c3b18726c4540c5d83ff761155e6a30993c2e3a0  /tmp/dsp-evidence/context-1.zip' | sha256sum -c -
          URL='https://sdmntprcentralus.oaiusercontent.com/files/00000000-e758-81f5-8118-db310fa7b907/raw?se=2026-11-25T05%3A12%3A19Z&sp=r&sv=2026-06-06&sr=b&scid=61e433db-e193-51c7-900f-3538b97b99cc&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-25T00%3A04%3A40Z&ske=2026-11-26T00%3A04%3A40Z&sks=b&skv=2026-06-06&sig=WIfczLnN8WkfJTYmd9Jvo%2BTksav45mrqc%2BVORqQjC%2B8%3D'
          echo "::add-mask::$URL"
          curl -fsSL --retry 2 --max-time 60 "$URL" -o /tmp/dsp-evidence/context-2.zip
          echo '2a67778db9730b549911ff57bd253eb57905de8e6a533502f12c210622710844  /tmp/dsp-evidence/context-2.zip' | sha256sum -c -
          python scripts/stage-packed-dsp.py /tmp/dsp-evidence
      - name: Commit only public result projection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streaming-lab/dsp-analysis-nov22/comparison.json streaming-lab/dsp-analysis-nov22/evidence.json
          git commit -m 'Stage verified packed DSP public result projection'
          git push origin HEAD:research/nov25-packed-dsp-lab
