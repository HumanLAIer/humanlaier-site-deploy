name: One-time public November 17 media transcription research
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-public-nov17-asr.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-asr:
    if: github.repository == 'HumanLAIer/humanlaier-site-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded CPU transcription, no model API
        run: python -m pip install --quiet --only-binary=:all: 'faster-whisper==1.2.1'
      - name: Transcribe the exact original published 120-second MP4 once
        run: python scripts/oneoff_nov17_source_asr.py
      - name: Preserve model words and media-local time candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: nov17-original-media-ASR-candidate
          path: nov17-participation-asr-candidate.json
          retention-days: 1
