name: Verify LIVE portrait-video nine-ticker page and continuous model crawls
on:
  pull_request:
    paths:
      - '.github/workflows/verify-nine-live-pages.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-nine-live-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-public-revision:
    if: github.repository == 'HumanLAIer/humanlaier-site-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild byte-exact public artifact for the production main SHA
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          GITHUB_SHA="$BASE_SHA" node scripts/build-pages.cjs
      - name: Independent live HTTP SHA proof for full-height video, nine continuous transcripts and public source media
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,time,urllib.request
          local=pathlib.Path(".pages-build/streaming-demo/nine-tickers")
          root="https://humanlaier.com/streaming-demo/nine-tickers/"
          source_part="58e8dd7b568a65203d9a5c204f72f1a3538da58951c7a3f178844547c5fc91de"
          exact=("index.html","styles.css","app.js","comparison.json",
                 "video-manifest.json","commercial-180.mp4","commercial-preview.jpg")
          expected={name:local.joinpath(name).read_bytes() for name in exact}
          def sha(raw):return hashlib.sha256(raw).hexdigest()
          def public(name,attempt):
              maxbytes=len(expected[name])+32
              url=root+name+"?verified-layout="+sha(expected["index.html"])[:14]+"&attempt="+str(attempt)
              req=urllib.request.Request(url,
                headers={"User-Agent":"Mozilla/5.0 HL-Portrait-Crawl-Live-Audit",
                         "Accept":"*/*","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=48) as response:
                  if response.status!=200:raise ValueError("REMOTE_HTTP_NOT_200 "+name)
                  data=response.read(maxbytes+1)
                  if not data or len(data)>maxbytes:
                      raise ValueError("REMOTE_ASSET_SIZE_UNEXPECTED "+name)
                  return data
          for attempt in range(24):
              try:
                  # Detect stale GitHub Pages deployments cheaply BEFORE
                  # fetching all 14 MB of real video.
                  for name in ("index.html","styles.css","app.js"):
                      got=public(name,attempt)
                      if sha(got)!=sha(expected[name]):
                          raise ValueError("REMOTE_REVISION_NOT_CURRENT "+name)
                  html=expected["index.html"].decode()
                  css=expected["styles.css"].decode()
                  js=expected["app.js"].decode()
                  assert 'class="video-column"' in html
                  assert 'class="right-panel"' in html
                  assert html.index('class="tickers"')<html.index('class="metrics"')
                  assert 'var(--video-ratio)' in css
                  assert "grid-template-rows:27px repeat(9,minmax(0,1fr))" in css
                  assert 'function buildTimelines()' in js
                  assert 'function panLines(seconds)' in js
                  assert 'requestAnimationFrame(renderFrame)' in js
                  assert 'function compareWords(' in js
                  assert "sourceSeekRequested" in js
                  dataset=json.loads(expected["comparison.json"])
                  manifest=json.loads(expected["video-manifest.json"])
                  assert dataset["source"]["sourcePartSha256"]==source_part
                  assert dataset["provenance"]["humanGoldAvailable"] is False
                  assert dataset["source"]["mediaEventSyncVerified"] is False
                  assert len(dataset["lanes"])==9 and len(dataset["clips"])==12
                  assert manifest["sourcePartSha256"]==source_part
                  assert manifest["originalAudioIncluded"] is True
                  assert manifest["mediaEventSyncVerified"] is False
                  for name in exact[3:]:
                      got=public(name,attempt)
                      if sha(got)!=sha(expected[name]):
                          raise ValueError("REMOTE_SOURCE_SHA_MISMATCH "+name)
                  assert expected["commercial-180.mp4"][4:8]==b"ftyp"
                  print(json.dumps({
                      "status":"LIVE_PORTRAIT_VIDEO_NINE_CONTINUOUS_TICKERS_SHA_VERIFIED",
                      "url":root,
                      "sourcePartSha256":source_part,
                      "videoSha256":sha(expected["commercial-180.mp4"]),
                      "verifiedAssets":len(exact),
                      "models":3,"decodings":9,"sourceBlocks":12,
                      "videoBytes":len(expected["commercial-180.mp4"]),
                      "noHumanGold":True,
                      "wordTimeInterpolationNotVerified":True
                  },sort_keys=True))
                  break
              except Exception as exc:
                  message=type(exc).__name__+": "+str(exc)[:140]
                  if attempt==23:
                      raise RuntimeError("LIVE_SITE_NOT_YET_MATCHING_APPROVED_MAIN: "+message) from exc
                  print("PUBLIC_PROPAGATION_RECHECK "+str(attempt+1)+": "+message,flush=True)
                  time.sleep(6)
          PY
