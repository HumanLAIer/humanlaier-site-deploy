name: Stage verified Coats decoder guard results
on:
  push:
    branches: [research/nov22-coats-guarded-comparison]
    paths: [.github/workflows/stage-coats-guard-once.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'HumanLAIer/humanlaier-site-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact artifact; remove private object paths
        shell: bash
        run: |
          set +x
          URL='https://sdmntprcentralus.oaiusercontent.com/files/00000000-ec80-81f5-b0c1-b93cd11f6043/raw?se=2026-11-24T20%3A25%3A47Z&sp=r&sv=2026-06-06&sr=b&scid=9a1d888a-52c9-5079-b90e-59f9d8717e3e&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-24T12%3A03%3A09Z&ske=2026-11-25T12%3A03%3A09Z&sks=b&skv=2026-06-06&sig=jr%2Bpm25IiDlVxJflMscL1y02jVDSyXJ3OIm9NXKXbFU%3D'
          echo "::add-mask::$URL"
          curl --silent --show-error --fail --location --retry 2 --max-time 120 "$URL" -o /tmp/hl-coats.zip
          echo '7c05130430c276792e26ff8917d8eda01a7cac4e075f04e841bcfe8f9650a308  /tmp/hl-coats.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile,json,hashlib,pathlib
          with zipfile.ZipFile('/tmp/hl-coats.zip') as z:
              assert z.namelist()==['paired-results.json']
              raw=z.read('paired-results.json')
          assert hashlib.sha256(raw).hexdigest()=='ef1c300534b7c93cc64a1149d95482141865e840a8aa49bcb9058b3b91d43cde'
          d=json.loads(raw)
          for rec in d['baselineReceipts'].values():rec.pop('leaf')
          for r in d['rows']:r['receipt'].pop('leaf')
          d['privateReportSha256']='ef1c300534b7c93cc64a1149d95482141865e840a8aa49bcb9058b3b91d43cde'
          b=(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False)+'\n').encode()
          assert hashlib.sha256(b).hexdigest()=='b354a1b575b6ba09858bcd781e995247f4eb4649e55f34f68b5fa91381ee8f70'
          pathlib.Path('streaming-lab/coats-guarded-nov22/paired-results.json').write_bytes(b)
          PY
          node scripts/verify-coats-guard.cjs
          node --check streaming-lab/coats-guarded-nov22/app.js
      - name: Commit verified public report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streaming-lab/coats-guarded-nov22/paired-results.json
          git commit -m 'Stage checksum-verified paired decoder results'
          git push origin HEAD:research/nov22-coats-guarded-comparison
