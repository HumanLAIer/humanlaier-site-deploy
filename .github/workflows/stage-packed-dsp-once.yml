          echo "::add-mask::$URL"
          curl -fsSL --retry 2 --max-time 60 "$URL" -o /tmp/dsp-evidence/context-0.zip
          echo '1a69c969142e12c2ba0d698b8ea3a2806fd5c58d4f288da4d396ac71ccf99a0e  /tmp/dsp-evidence/context-0.zip' | sha256sum -c -
