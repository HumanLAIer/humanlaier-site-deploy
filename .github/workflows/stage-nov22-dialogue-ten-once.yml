name: Stage verified Nov22 dialogue ten-ticker public export
on:
  push:
    branches: [research/nov22-dialogue-ten-layout]
    paths: [.github/workflows/stage-nov22-dialogue-ten-once.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'HumanLAIer/humanlaier-site-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch only the approved public export; verify archive and every asset
        shell: bash
        run: |
          set +x
          URL='https://sdmntprcentralus.oaiusercontent.com/files/00000000-60c4-81f5-bbd9-c22262c06c26/raw?se=2026-11-24T18%3A18%3A35Z&sp=r&sv=2026-06-06&sr=b&scid=c0319741-7c80-5915-854e-4fa195cdd42f&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-24T01%3A02%3A22Z&ske=2026-11-25T01%3A02%3A22Z&sks=b&skv=2026-06-06&sig=lFtDB23bPOI0zkUkR1vZ53BE680YUeu64czYxoUymco%3D'
          echo "::add-mask::$URL"
          curl --silent --show-error --fail --location --retry 2 --max-time 120 "$URL" -o /tmp/hl-ten.zip
          echo 'dd2da1c19286ae19a8c9d32b214f67deccaa70d7c77b434991fdacee3d00f674  /tmp/hl-ten.zip' | sha256sum -c -
          python - <<'PY'
          import zipfile, pathlib
          root=pathlib.Path('/tmp/hl-ten')
          root.mkdir()
          allowed={'comparison.json','dialogue-1.wav','dialogue-2.wav','dialogue-3.wav','export-manifest.json'}
          with zipfile.ZipFile('/tmp/hl-ten.zip') as z:
              assert set(z.namelist())==allowed
              for i in z.infolist():
                  assert i.file_size < 22000000
                  (root/i.filename).write_bytes(z.read(i))
          PY
          node scripts/stage-dialogue-ten.cjs /tmp/hl-ten 3360ecbfde664065459bfc5934772a271a0f3cd9f80b62f78219f48d265b060a
          node scripts/verify-dialogue-ten.cjs
          node --check streaming-lab/ten-tickers-nov22/app.js
      - name: Commit verified public assets (workflow edits by repository administrator)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore .github/workflows/ci-gated-pages.yml
          git add streaming-lab scripts
          git commit -m 'Stage exact ten-lane results and dialogue audio for protected release'
          git push origin HEAD:research/nov22-dialogue-ten-layout
