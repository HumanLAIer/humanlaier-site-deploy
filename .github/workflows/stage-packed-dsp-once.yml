          echo "::add-mask::$URL"
          curl -fsSL --retry 2 --max-time 60 "$URL" -o /tmp/dsp-evidence/dsp-1.zip
          echo '3bd0000672dc3dcb91bd2b7c769557ad3501306dacdc46af3cacdbe3ada0065e  /tmp/dsp-evidence/dsp-1.zip' | sha256sum -c -
          URL='https://sdmntprcentralus.oaiusercontent.com/files/00000000-9b28-81f5-967c-79aff1e82cee/raw?se=2026-11-25T05%3A12%3A18Z&sp=r&sv=2026-06-06&sr=b&scid=3e40fecf-74d7-5a91-a7e9-876a0815f345&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-25T00%3A14%3A45Z&ske=2026-11-26T00%3A14%3A45Z&sks=b&skv=2026-06-06&sig=gepSWbcTGVzM478qSoFPgrDetaIoXdATKxq90RLcuZU%3D'
          echo "::add-mask::$URL"
          curl -fsSL --retry 2 --max-time 60 "$URL" -o /tmp/dsp-evidence/dsp-2.zip
          echo '225c6331310afa9feb3d88e5b88de7f2d6f4407b2d6f75f98e312d594331526a  /tmp/dsp-evidence/dsp-2.zip' | sha256sum -c -
