name: Stage verified packed DSP evidence once
on:
  push:
    branches: [research/nov25-packed-dsp-lab]
    paths: [.github/workflows/stage-packed-dsp-once.yml]
permissions:
  contents: write
concurrency:
  group: nov25-packed-dsp-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'HumanLAIer/humanlaier-site-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify authorized artifacts and project evidence
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/dsp-evidence
          URL='https://sdmntprcentralus.oaiusercontent.com/files/00000000-1178-81f5-8e4a-612d7da58967/raw?se=2026-11-25T05%3A12%3A18Z&sp=r&sv=2026-06-06&sr=b&scid=5b102b22-64f9-5c53-8763-36378715e544&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-24T12%3A59%3A42Z&ske=2026-11-25T12%3A59%3A42Z&sks=b&skv=2026-06-06&sig=/4wQ5SeBwuMwd7NE9y00R/rSOTYLENzC7m6NegArrgc%3D'
          echo "::add-mask::$URL"
          curl -fsSL --retry 2 --max-time 60 "$URL" -o /tmp/dsp-evidence/dsp-0.zip
          echo 'f69ef8c53bffdb200b411cc90216a0ab5ba762fe48722dbd81d1c5a032cad35b  /tmp/dsp-evidence/dsp-0.zip' | sha256sum -c -
